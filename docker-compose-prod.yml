name: inlumen

networks:
  datapact_network:
    name: datapact_network

volumes:
  frontend_node_modules:
  codegen_state:
  runner_state:
  inlumen_model_store:
    name: ${INLUMEN_MODEL_STORE_VOLUME:-inlumen_model_store}

services:
  neo4j:
    image: neo4j:5-community
    container_name: inlumen_neo4j
    hostname: datapact-neo4j-db
    mem_limit: ${NEO4J_MEM_LIMIT:-2G}
    restart: unless-stopped
    volumes:
      - ./neo4j_data_volume:/data
      - ./neo4j_logs_volume:/logs
      - ./neo4j_import_volume:/import
      - ./neo4j_plugins_volume:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    healthcheck:
      test:
        - CMD-SHELL
        - 'AUTH_USER="$${NEO4J_AUTH%%/*}"; AUTH_PASS="$${NEO4J_AUTH#*/}"; cypher-shell -u "$$AUTH_USER" -p "$$AUTH_PASS" "RETURN 1;"'
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      datapact_network:
        aliases:
          - datapact-neo4j-db

  minio:
    image: minio/minio:latest
    container_name: inlumen_minio
    hostname: datapact-minio-db
    command: server --address 0.0.0.0:9000 --console-address ":9099" /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-datapact}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-datapact}
    volumes:
      - ./minio_data:/data
    networks:
      datapact_network:
        aliases:
          - datapact-minio-db

  backend:
    build:
      context: ./backend
    container_name: inlumen_backend
    hostname: inlumen-backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
      codegen:
        condition: service_healthy
      runner:
        condition: service_healthy
    working_dir: /usr/inlumen
    ports:
      - "${INLUMEN_API_PORT:-5000}:${INLUMEN_API_PORT:-5000}"
    volumes:
      - ./backend:/usr/inlumen
    environment:
      PYTHONUNBUFFERED: "1"
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      INLUMEN_API_PORT: ${INLUMEN_API_PORT:-5000}
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-datapact}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-datapact}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      INLUMEN_CODEGEN_SERVICE_URL: ${INLUMEN_CODEGEN_SERVICE_URL:-http://codegen:8010}
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:?INLUMEN_CODEGEN_SERVICE_API_KEY is required}
      INLUMEN_CODEGEN_NODE_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_NODE_REQUEST_TIMEOUT_SECONDS:-300}
      INLUMEN_CODEGEN_PIPELINE_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_PIPELINE_REQUEST_TIMEOUT_SECONDS:-1200}
      INLUMEN_CODEGEN_DEPLOYMENT_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_DEPLOYMENT_TIMEOUT_SECONDS:-1800}
      INLUMEN_CODEGEN_RUN_DB_PATH: ${INLUMEN_CODEGEN_RUN_DB_PATH:-/usr/inlumen/state/codegen-runs.sqlite3}
      INLUMEN_RUNNER_SERVICE_URL: ${INLUMEN_RUNNER_SERVICE_URL:-http://runner:8020}
      INLUMEN_RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY:?INLUMEN_RUNNER_SERVICE_API_KEY is required}
      INLUMEN_RUNNER_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_RUNNER_REQUEST_TIMEOUT_SECONDS:-10}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-1.0}
    command:
      - python
      - dev_runner.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"INLUMEN_API_PORT\", \"5000\")}/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - datapact_network

  runner:
    build:
      context: ./runner
    image: ${INLUMEN_RUNNER_IMAGE:-inlumen-runner-service:local}
    container_name: inlumen_runner
    hostname: runner
    restart: unless-stopped
    expose:
      - "8020"
    volumes:
      - runner_state:/app/state
    environment:
      PYTHONUNBUFFERED: "1"
      RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY:?INLUMEN_RUNNER_SERVICE_API_KEY is required}
      RUNNER_JOB_DB_PATH: ${RUNNER_JOB_DB_PATH:-/app/state/pipeline-runs.sqlite3}
      RUNNER_ARTIFACT_ROOT: ${RUNNER_ARTIFACT_ROOT:-/app/state/artifacts}
      RUNNER_ADAPTER: ${RUNNER_ADAPTER:-dagster}
      INLUMEN_CODEGEN_SERVICE_URL: ${INLUMEN_CODEGEN_SERVICE_URL:-http://codegen:8010}
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:?INLUMEN_CODEGEN_SERVICE_API_KEY is required}
      RUNNER_DAGSTER_TIMEOUT_SECONDS: ${RUNNER_DAGSTER_TIMEOUT_SECONDS:-1800}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/ready', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - datapact_network

  codegen:
    build:
      context: ./codegen
    image: ${INLUMEN_CODEGEN_IMAGE:-inlumen-codegen-service:local}
    container_name: inlumen_codegen
    hostname: codegen
    restart: unless-stopped
    expose:
      - "8010"
    volumes:
      - codegen_state:/app/state
      - inlumen_model_store:/models
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEGEN_VALIDATION_HOST_WORKDIR:-/var/lib/inlumen/codegen-workspaces}:${CODEGEN_VALIDATION_WORKDIR:-/var/lib/inlumen/codegen-workspaces}
    environment:
      PYTHONUNBUFFERED: "1"
      CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:?INLUMEN_CODEGEN_SERVICE_API_KEY is required}
      CODEGEN_JOB_DB_PATH: ${CODEGEN_JOB_DB_PATH:-/app/state/codegen-jobs.sqlite3}
      CODEGEN_DOCKER_VALIDATION_ENABLED: ${CODEGEN_DOCKER_VALIDATION_ENABLED:-true}
      CODEGEN_VALIDATION_WORKDIR: ${CODEGEN_VALIDATION_WORKDIR:-/var/lib/inlumen/codegen-workspaces}
      CODEGEN_VALIDATION_MEMORY_LIMIT: ${CODEGEN_VALIDATION_MEMORY_LIMIT:-1g}
      CODEGEN_VALIDATION_CPU_LIMIT: ${CODEGEN_VALIDATION_CPU_LIMIT:-1}
      CODEGEN_PIPELINE_CACHE_TTL_SECONDS: ${CODEGEN_PIPELINE_CACHE_TTL_SECONDS:-3600}
      CODEGEN_PIPELINE_CACHE_MAX_ENTRIES: ${CODEGEN_PIPELINE_CACHE_MAX_ENTRIES:-32}
      CODEGEN_ALLOW_DETERMINISTIC_FALLBACK: "false"
      CODEGEN_DEPENDENCY_INSTALL_TIMEOUT_SECONDS: ${CODEGEN_DEPENDENCY_INSTALL_TIMEOUT_SECONDS:-600}
      INLUMEN_MODEL_ROOT: /models
      INLUMEN_MODEL_STORE_VOLUME: ${INLUMEN_MODEL_STORE_VOLUME:-inlumen_model_store}
      CODEGEN_INPUT_FILE_BASE_URL: ${CODEGEN_INPUT_FILE_BASE_URL:-http://backend:${INLUMEN_API_PORT:-5000}/api/files/content}
      CODEGEN_INPUT_FILE_ALLOW_INSECURE_HTTP: ${CODEGEN_INPUT_FILE_ALLOW_INSECURE_HTTP:-true}
      CODEGEN_INPUT_FILE_MAX_BYTES: ${CODEGEN_INPUT_FILE_MAX_BYTES:-52428800}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - datapact_network

  frontend:
    build:
      context: ./frontend
    container_name: inlumen_frontend
    hostname: inlumen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:${FRONTEND_PORT:-8080}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      NODE_ENV: development
      VITE_INLUMEN_API_PORT: ${INLUMEN_API_PORT:-5000}
      VITE_INLUMEN_API_URL: ${VITE_INLUMEN_API_URL:-${INLUMEN_API_PUBLIC_URL:-}}
      VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-${AUTH_ENABLED:-false}}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-inlumen}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-inlumen-frontend}
      VITE_ENABLE_REMOTE_CHATBOT_CONFIG_SYNC: ${VITE_ENABLE_REMOTE_CHATBOT_CONFIG_SYNC:-true}
    command: npm run dev -- --host 0.0.0.0
    networks:
      - datapact_network
