name: inlumen

x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  datapact_network:
    name: ${INLUMEN_PRIVATE_NETWORK:-datapact_network}
  tunnel_network:
    name: ${INLUMEN_TUNNEL_NETWORK:-cloudflare_default}
    external: true

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  runner_artifacts:

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  neo4j:
    extends:
      file: docker-compose.base.yml
      service: neo4j
    image: ${NEO4J_IMAGE:-neo4j:5-community@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?NEO4J_AUTH is required}

  minio:
    extends:
      file: docker-compose.base.yml
      service: minio
    image: ${MINIO_IMAGE:-quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
      additional_contexts:
        agents: ./packages/agents
    image: ${INLUMEN_BACKEND_IMAGE:-inlumen-backend:local}
    pull_policy: ${INLUMEN_APP_PULL_POLICY:-build}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      AUTH_ENABLED: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inlumen}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_CLOCK_SKEW_SECONDS: ${KEYCLOAK_CLOCK_SKEW_SECONDS:-5}
    command: ["python", "migrate.py"]
    networks:
      - datapact_network

  runner:
    extends:
      file: docker-compose.base.yml
      service: runner
    mem_limit: ${INLUMEN_RUNNER_MEM_LIMIT:-1G}
    pids_limit: ${INLUMEN_APP_PIDS_LIMIT:-512}
    logging: *app-logging
    image: ${INLUMEN_RUNNER_IMAGE:-inlumen-runner-service:local}
    pull_policy: ${INLUMEN_APP_PULL_POLICY:-build}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - runner_artifacts:/app/state/artifacts
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inlumen}
      RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY:?INLUMEN_RUNNER_SERVICE_API_KEY is required}
      RUNNER_ARTIFACT_ROOT: /app/state/artifacts
      RUNNER_MAX_OUTSTANDING_RUNS: ${RUNNER_MAX_OUTSTANDING_RUNS:-4}
      RUNNER_MAX_GLOBAL_OUTSTANDING_RUNS: ${RUNNER_MAX_GLOBAL_OUTSTANDING_RUNS:-50}
      INLUMEN_CODEGEN_SERVICE_URL: http://codegen:8010
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:?INLUMEN_CODEGEN_SERVICE_API_KEY is required}
      NEO4J_URI: bolt://datapact-neo4j-db:7687
      NEO4J_AUTH: ${NEO4J_AUTH}
    healthcheck:
      interval: 10s
      retries: 20

  codegen:
    extends:
      file: docker-compose.base.yml
      service: codegen
    mem_limit: ${INLUMEN_CODEGEN_MEM_LIMIT:-2G}
    pids_limit: ${INLUMEN_APP_PIDS_LIMIT:-512}
    logging: *app-logging
    image: ${INLUMEN_CODEGEN_IMAGE:-inlumen-codegen-service:local}
    pull_policy: ${INLUMEN_APP_PULL_POLICY:-build}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEGEN_VALIDATION_HOST_WORKDIR:-/var/lib/inlumen/codegen-workspaces}:${CODEGEN_VALIDATION_WORKDIR:-/var/lib/inlumen/codegen-workspaces}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inlumen}
      CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY}
      CODEGEN_VALIDATION_WORKDIR: ${CODEGEN_VALIDATION_WORKDIR:-/var/lib/inlumen/codegen-workspaces}
      CODEGEN_MAX_OUTSTANDING_RUNS: ${CODEGEN_MAX_OUTSTANDING_RUNS:-4}
      CODEGEN_MAX_GLOBAL_OUTSTANDING_RUNS: ${CODEGEN_MAX_GLOBAL_OUTSTANDING_RUNS:-12}
      # One execution-service process owns admission for the whole VM.
      # On the 8-vCPU/30-GiB VM, two ML workers use 2 CPUs/4 GiB each.
      CODEGEN_EXECUTION_MAX_PENDING_RUNS: ${CODEGEN_EXECUTION_MAX_PENDING_RUNS:-50}
      CODEGEN_EXECUTION_MAX_ACTIVE_RUNS: ${CODEGEN_EXECUTION_MAX_ACTIVE_RUNS:-2}
      CODEGEN_EXECUTION_CPU_BUDGET: ${CODEGEN_EXECUTION_CPU_BUDGET:-4}
      CODEGEN_EXECUTION_MEMORY_GIB: ${CODEGEN_EXECUTION_MEMORY_GIB:-8}
      CODEGEN_ML_CPU_THREADS: ${CODEGEN_ML_CPU_THREADS:-2}
      CODEGEN_INPUT_FILE_BASE_URL: http://backend:5000/api/files/content
      CODEGEN_INPUT_FILE_ALLOW_INSECURE_HTTP: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      interval: 10s
      retries: 20

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    mem_limit: ${INLUMEN_BACKEND_MEM_LIMIT:-2G}
    pids_limit: ${INLUMEN_APP_PIDS_LIMIT:-512}
    logging: *app-logging
    image: ${INLUMEN_BACKEND_IMAGE:-inlumen-backend:local}
    pull_policy: ${INLUMEN_APP_PULL_POLICY:-build}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      codegen:
        condition: service_healthy
      runner:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      APP_ENV: production
      INLUMEN_API_PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inlumen}
      AUTH_ENABLED: "true"
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?KEYCLOAK_JWKS_URL is required}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:?KEYCLOAK_AUDIENCE is required}
      CORS_ALLOWED_ORIGINS: ${INLUMEN_PUBLIC_URL:?INLUMEN_PUBLIC_URL is required}
      NEO4J_AUTH: ${NEO4J_AUTH}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INLUMEN_SECRET_ENCRYPTION_KEY: ${INLUMEN_SECRET_ENCRYPTION_KEY:?INLUMEN_SECRET_ENCRYPTION_KEY is required}
      INLUMEN_CODEGEN_SERVICE_URL: http://codegen:8010
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY}
      INLUMEN_RUNNER_SERVICE_URL: http://runner:8020
      INLUMEN_RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY}
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "${INLUMEN_WEB_WORKERS:-2}", "--threads", "${INLUMEN_WEB_THREADS:-4}", "--timeout", "1800", "inlumen_api:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    mem_limit: ${INLUMEN_FRONTEND_MEM_LIMIT:-256M}
    pids_limit: ${INLUMEN_APP_PIDS_LIMIT:-512}
    logging: *app-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_INLUMEN_API_URL: ${INLUMEN_PUBLIC_URL}
        VITE_AUTH_ENABLED: "true"
        VITE_REVIEW_AI_CHANGES_DEFAULT: ${VITE_REVIEW_AI_CHANGES_DEFAULT:-true}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL is required}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-inlumen}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-inlumen-frontend}
    image: ${INLUMEN_FRONTEND_IMAGE:-inlumen-frontend:local}
    pull_policy: ${INLUMEN_APP_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      datapact_network: {}
      tunnel_network:
        aliases: [inlumen-frontend]
