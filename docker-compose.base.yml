# Settings that the development file (docker-compose.yml) and the production
# file (docker-compose-prod.yml) share. Both take them with `extends`, so the
# commands in the documentation and in scripts/deploy_vm.sh are unchanged.
# This file is not started alone: it has no images, networks or volumes of
# its own. A setting that differs between the two files stays in those files.
# `depends_on` is not here, because the two files start different services.
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inlumen}
      POSTGRES_USER: ${POSTGRES_USER:-inlumen}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
    - datapact_network
  neo4j:
    mem_limit: ${NEO4J_MEM_LIMIT:-2G}
    restart: unless-stopped
    environment:
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    healthcheck:
      # cypher-shell launches a JVM for every probe. Under Docker Desktop
      # pressure those probes can overlap after timeout, exhaust the 2 GiB
      # container limit, and make an otherwise started database unresponsive.
      # Neo4j only exposes HTTP after the database is ready to accept traffic.
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - --timeout=3
      - http://127.0.0.1:7474/
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks:
      datapact_network:
        aliases:
        - datapact-neo4j-db
  minio:
    command: server --address 0.0.0.0:9000 --console-address ":9099" /data
    restart: unless-stopped
    networks:
      datapact_network:
        aliases:
        - datapact-minio-db
  backend:
    build:
      context: ./backend
      additional_contexts:
        agents: ./packages/agents
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: '1'
      KEYCLOAK_CLOCK_SKEW_SECONDS: ${KEYCLOAK_CLOCK_SKEW_SECONDS:-5}
      INLUMEN_CODEGEN_INPUT_MAX_BYTES: ${INLUMEN_CODEGEN_INPUT_MAX_BYTES:-52428800}
      INLUMEN_CODEGEN_INPUT_TOTAL_MAX_BYTES: ${INLUMEN_CODEGEN_INPUT_TOTAL_MAX_BYTES:-104857600}
      INLUMEN_CODEGEN_NODE_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_NODE_REQUEST_TIMEOUT_SECONDS:-300}
      INLUMEN_CODEGEN_PIPELINE_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_PIPELINE_REQUEST_TIMEOUT_SECONDS:-1200}
      INLUMEN_CODEGEN_DEPLOYMENT_TIMEOUT_SECONDS: ${INLUMEN_CODEGEN_DEPLOYMENT_TIMEOUT_SECONDS:-1800}
      INLUMEN_RUNNER_REQUEST_TIMEOUT_SECONDS: ${INLUMEN_RUNNER_REQUEST_TIMEOUT_SECONDS:-10}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-1.0}
    networks:
    - datapact_network
  runner:
    build:
      context: ./runner
    restart: unless-stopped
    expose:
    - '8020'
    environment:
      RUNNER_ADAPTER: ${RUNNER_ADAPTER:-dagster}
      RUNNER_DAGSTER_TIMEOUT_SECONDS: ${RUNNER_DAGSTER_TIMEOUT_SECONDS:-1800}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/ready', timeout=5)
      timeout: 5s
    networks:
    - datapact_network
  codegen:
    build:
      context: ./codegen
      additional_contexts:
        agents: ./packages/agents
    restart: unless-stopped
    expose:
    - '8010'
    environment:
      CODEGEN_DOCKER_VALIDATION_ENABLED: ${CODEGEN_DOCKER_VALIDATION_ENABLED:-true}
      CODEGEN_PIPELINE_CACHE_TTL_SECONDS: ${CODEGEN_PIPELINE_CACHE_TTL_SECONDS:-3600}
      CODEGEN_PIPELINE_CACHE_MAX_ENTRIES: ${CODEGEN_PIPELINE_CACHE_MAX_ENTRIES:-32}
      CODEGEN_ALLOW_DETERMINISTIC_FALLBACK: 'false'
      CODEGEN_DEPENDENCY_INSTALL_TIMEOUT_SECONDS: ${CODEGEN_DEPENDENCY_INSTALL_TIMEOUT_SECONDS:-600}
      # Dagster workers create persistent per-workspace caches on demand.
      INLUMEN_MODEL_STORE_VOLUME: ${INLUMEN_MODEL_STORE_VOLUME:-inlumen_model_store}
      # Runs join this Docker network when it exists; see docs/plugins.md.
      INLUMEN_RUN_TOOL_NETWORK: ${INLUMEN_RUN_TOOL_NETWORK:-inlumen_tools}
      CODEGEN_INPUT_FILE_MAX_BYTES: ${CODEGEN_INPUT_FILE_MAX_BYTES:-52428800}
      # Step outputs are uploaded to MinIO after each run and passed to the
      # runner and backend by reference. Set to "inline" to keep them on the runner.
      INLUMEN_RUN_ARTIFACT_STORAGE: ${INLUMEN_RUN_ARTIFACT_STORAGE:-minio}
      INLUMEN_RUN_ARTIFACT_RETENTION_DAYS: ${INLUMEN_RUN_ARTIFACT_RETENTION_DAYS:-30}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-datapact-minio-db:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=5)
      timeout: 5s
    networks:
    - datapact_network
