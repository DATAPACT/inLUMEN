name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Check generated contracts and service modules
        run: python scripts/sync_shared.py --check
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Run backend tests
        run: python scripts/run_tests.py --component backend

  codegen:
    name: Code generation service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codegen/pyproject.toml
      - name: Install codegen dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --project codegen --frozen --extra dev --python 3.11
      - name: Run codegen tests
        run: python scripts/run_tests.py --component codegen

  runner:
    name: Pipeline runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runner/pyproject.toml
      - name: Install runner dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --project runner --frozen --extra dev --python 3.11
      - name: Run runner tests
        run: python scripts/run_tests.py --component runner

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests and checks
        run: python3 scripts/run_tests.py --component frontend
      - name: Verify development container runtime
        run: |
          docker build -t inlumen-frontend:ci frontend
          docker run --rm inlumen-frontend:ci npm exec vite -- --version
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate
      - name: Install test browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser recovery and accessibility tests
        run: npm run test:e2e --prefix frontend

  integration:
    name: Graph transactions and workspace isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 12
      neo4j:
        image: neo4j:5-community@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
        env:
          NEO4J_AUTH: neo4j/integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget --spider -q http://localhost:7474"
          --health-interval 10s --health-retries 24 --health-start-period 30s
    env:
      TEST_POSTGRES_URL: postgresql://postgres:integration-password@localhost:5432/postgres
      RUN_NEO4J_INTEGRATION: "1"
      RUN_MINIO_INTEGRATION: "1"
      MINIO_ENDPOINT: localhost:19000
      MINIO_ROOT_USER: integration-user
      MINIO_ROOT_PASSWORD: integration-password
      NEO4J_URI: bolt://localhost:7687
      NEO4J_AUTH: neo4j/integration-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      # MinIO's old public images are no longer reliably pullable. Build the
      # source-only release using its declared toolchain and an immutable commit.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build disposable attachment storage
        timeout-minutes: 10
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
          CGO_ENABLED: '0'
        run: |
          # RELEASE.2025-10-15T17-29-55Z
          go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          "$GOBIN/minio" --version
      - name: Start disposable attachment storage
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/minio.pid"
          # Wait until the process is ready before running integration tests.
          if ! curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --retry-max-time 60 --connect-timeout 2 --max-time 5 \
            http://localhost:19000/minio/health/ready; then
            cat "$RUNNER_TEMP/minio.log"
            exit 1
          fi
      - run: cd backend && python -m unittest discover -s tests -p 'test_*integration.py'
      - run: cd backend && python -m unittest discover -s tests -p test_agent_workspace_queries.py
      - run: python scripts/test_postgres_workers.py runner
      - run: python scripts/test_postgres_workers.py codegen
      - name: Stop disposable attachment storage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" || true
          fi
          if [ -f "$RUNNER_TEMP/minio.log" ]; then
            cat "$RUNNER_TEMP/minio.log"
          fi

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: python3 scripts/run_tests.py --component compose
