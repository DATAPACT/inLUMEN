name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Check generated contracts and service modules
        run: python scripts/sync_shared.py --check
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Run backend tests
        run: python scripts/run_tests.py --component backend

  codegen:
    name: Code generation service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codegen/pyproject.toml
      - name: Install codegen dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --project codegen --frozen --extra dev --python 3.11
      - name: Run codegen tests
        run: python scripts/run_tests.py --component codegen

  runner:
    name: Pipeline runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runner/pyproject.toml
      - name: Install runner dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --project runner --frozen --extra dev --python 3.11
      - name: Run runner tests
        run: python scripts/run_tests.py --component runner

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests and checks
        run: python3 scripts/run_tests.py --component frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate
      - name: Install test browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Browser recovery and accessibility tests
        run: npm run test:e2e --prefix frontend

  integration:
    name: Graph transactions and workspace isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 12
      neo4j:
        image: neo4j:5-community@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
        env:
          NEO4J_AUTH: neo4j/integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget --spider -q http://localhost:7474"
          --health-interval 10s --health-retries 24 --health-start-period 30s
    env:
      TEST_POSTGRES_URL: postgresql://postgres:integration-password@localhost:5432/postgres
      RUN_NEO4J_INTEGRATION: "1"
      RUN_MINIO_INTEGRATION: "1"
      MINIO_ENDPOINT: localhost:19000
      MINIO_ROOT_USER: integration-user
      MINIO_ROOT_PASSWORD: integration-password
      NEO4J_URI: bolt://localhost:7687
      NEO4J_AUTH: neo4j/integration-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Start disposable attachment storage
        run: |
          docker run -d --name integration-minio -p 19000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          # Docker can accept the connection before MinIO starts serving HTTP,
          # producing a connection reset rather than connection refused.
          if ! curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 --retry-max-time 60 --connect-timeout 2 --max-time 5 \
            http://localhost:19000/minio/health/ready; then
            docker logs integration-minio
            exit 1
          fi
      - run: cd backend && python -m unittest discover -s tests -p 'test_*integration.py'
      - run: cd backend && python -m unittest discover -s tests -p test_agent_workspace_queries.py
      - run: python scripts/test_postgres_workers.py runner
      - run: python scripts/test_postgres_workers.py codegen

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: python3 scripts/run_tests.py --component compose
