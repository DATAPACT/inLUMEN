name: inlumen

networks:
  datapact_network:
    name: datapact_network
  # Pipeline runs join this network when it exists (INLUMEN_RUN_TOOL_NETWORK).
  # A plugin tool on a private address joins it to be reachable from a run.
  # The application's own services stay off it.
  inlumen_tools:
    name: ${INLUMEN_RUN_TOOL_NETWORK:-inlumen_tools}

volumes:
  frontend_node_modules:
  codegen_state:
  runner_state:
  postgres_data:

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    image: postgres:17-alpine
    container_name: inlumen_postgres
    hostname: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inlumen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  neo4j:
    extends:
      file: docker-compose.base.yml
      service: neo4j
    image: neo4j:5-community
    container_name: inlumen_neo4j
    hostname: datapact-neo4j-db
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./neo4j_data_volume:/data
      - ./neo4j_logs_volume:/logs
      - ./neo4j_import_volume:/import
      - ./neo4j_plugins_volume:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}

  minio:
    extends:
      file: docker-compose.base.yml
      service: minio
    image: minio/minio:latest
    container_name: inlumen_minio
    hostname: datapact-minio-db
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-datapact}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-datapact}
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9099}:9099"
    volumes:
      - ./minio_data:/data

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    container_name: inlumen_backend
    hostname: inlumen-backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
      codegen:
        condition: service_healthy
      runner:
        condition: service_healthy
    working_dir: /usr/inlumen
    ports:
      - "${INLUMEN_API_PORT:-5000}:${INLUMEN_API_PORT:-5000}"
    volumes:
      - ./backend:/usr/inlumen
      - ./packages/agents/src:/opt/inlumen-agents/src
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      INLUMEN_API_PORT: ${INLUMEN_API_PORT:-5000}
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-datapact}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-datapact}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD:-inlumen}@postgres:5432/${POSTGRES_DB:-inlumen}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      INLUMEN_CODEGEN_SERVICE_URL: ${INLUMEN_CODEGEN_SERVICE_URL:-http://codegen:8010}
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:-inlumen-local-codegen-token}
      INLUMEN_CODEGEN_RUN_DB_PATH: ${INLUMEN_CODEGEN_RUN_DB_PATH:-/usr/inlumen/state/codegen-runs.sqlite3}
      INLUMEN_RUNNER_SERVICE_URL: ${INLUMEN_RUNNER_SERVICE_URL:-http://runner:8020}
      INLUMEN_RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY:-inlumen-local-runner-token}
    command:
      - python
      - dev_runner.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"INLUMEN_API_PORT\", \"5000\")}/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 12

  runner:
    extends:
      file: docker-compose.base.yml
      service: runner
    image: inlumen-runner-service:local
    pull_policy: build
    container_name: inlumen_runner
    hostname: runner
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./runner/app:/app/app
      - runner_state:/app/state
    environment:
      PYTHONUNBUFFERED: "1"
      RUNNER_SERVICE_API_KEY: ${INLUMEN_RUNNER_SERVICE_API_KEY:-inlumen-local-runner-token}
      RUNNER_JOB_DB_PATH: ${RUNNER_JOB_DB_PATH:-/app/state/pipeline-runs.sqlite3}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD:-inlumen}@postgres:5432/${POSTGRES_DB:-inlumen}
      APP_ENV: development
      RUNNER_ARTIFACT_ROOT: ${RUNNER_ARTIFACT_ROOT:-/app/state/artifacts}
      INLUMEN_CODEGEN_SERVICE_URL: ${INLUMEN_CODEGEN_SERVICE_URL:-http://codegen:8010}
      INLUMEN_CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:-inlumen-local-codegen-token}
      NEO4J_URI: ${NEO4J_URI:-bolt://datapact-neo4j-db:7687}
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020 --reload
    healthcheck:
      interval: 5s
      retries: 24
      start_period: 10s

  codegen:
    extends:
      file: docker-compose.base.yml
      service: codegen
    image: inlumen-codegen-service:local
    pull_policy: build
    container_name: inlumen_codegen
    hostname: codegen
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./codegen/app:/app/app
      - ./packages/agents/src:/packages/agents/src
      - codegen_state:/app/state
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEGEN_VALIDATION_HOST_WORKDIR:-/tmp/inlumen-codegen-workspaces}:${CODEGEN_VALIDATION_WORKDIR:-/tmp/inlumen-codegen-workspaces}
    environment:
      PYTHONUNBUFFERED: "1"
      CODEGEN_SERVICE_API_KEY: ${INLUMEN_CODEGEN_SERVICE_API_KEY:-inlumen-local-codegen-token}
      CODEGEN_JOB_DB_PATH: ${CODEGEN_JOB_DB_PATH:-/app/state/codegen-jobs.sqlite3}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inlumen}:${POSTGRES_PASSWORD:-inlumen}@postgres:5432/${POSTGRES_DB:-inlumen}
      APP_ENV: development
      CODEGEN_VALIDATION_WORKDIR: ${CODEGEN_VALIDATION_WORKDIR:-/tmp/inlumen-codegen-workspaces}
      CODEGEN_INPUT_FILE_BASE_URL: ${CODEGEN_INPUT_FILE_BASE_URL:-http://backend:${INLUMEN_API_PORT:-5000}/api/files/content}
      CODEGEN_INPUT_FILE_ALLOW_INSECURE_HTTP: ${CODEGEN_INPUT_FILE_ALLOW_INSECURE_HTTP:-true}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-datapact}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-datapact}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload
    healthcheck:
      interval: 5s
      retries: 24
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: inlumen_frontend
    hostname: inlumen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:${FRONTEND_PORT:-8080}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      NODE_ENV: development
      VITE_INLUMEN_API_PORT: ${INLUMEN_API_PORT:-5000}
      VITE_INLUMEN_API_URL: ${VITE_INLUMEN_API_URL:-${INLUMEN_API_PUBLIC_URL:-}}
      # Keep browser and gateway identity modes in sync.
      VITE_AUTH_ENABLED: ${AUTH_ENABLED:-false}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-inlumen}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-inlumen-frontend}
      VITE_ENABLE_REMOTE_CHATBOT_CONFIG_SYNC: ${VITE_ENABLE_REMOTE_CHATBOT_CONFIG_SYNC:-true}
    command: npm run dev -- --host 0.0.0.0
    networks:
      - datapact_network

  # Optional example tool for trying plugins locally (examples/plugins).
  # Start with: docker compose --profile plugins-demo up -d mock-tool
  mock-tool:
    image: python:3.11-slim
    container_name: inlumen_mock_tool
    hostname: mock-tool
    profiles: ["plugins-demo"]
    working_dir: /app
    volumes:
      - ./examples/plugins:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      MOCK_TOOL_API_KEY: ${MOCK_TOOL_API_KEY:-demo-key}
    command: python mock_tool_server.py
    expose:
      - "8099"
    # datapact_network: the backend's Check endpoint. inlumen_tools: runs.
    networks:
      - datapact_network
      - inlumen_tools
