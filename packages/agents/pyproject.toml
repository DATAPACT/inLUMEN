[project]
name = "inlumen-agents"
# Versioned with inLUMEN releases (v1.0.0-beta.6 -> 1.0.0b6), see docs/adr/0005.
version = "1.0.0b6.dev0"
description = "inLUMEN's pipeline design and code generation agents, as a library."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["inlumen", "data pipelines", "code generation", "llm agents", "dagster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "packaging>=24.0",
]

[project.optional-dependencies]
# The pipeline design agent (inlumen.design).
design = [
  "autogen-agentchat>=0.7.5,<0.8",
  "autogen-ext[openai]>=0.7.5,<0.8",
]
# The code generator (inlumen.codegen).
codegen = [
  "docker>=7.1.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inlumen.contracts" = ["*.json"]
"inlumen.contracts.node_definitions" = ["*.json", "manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
