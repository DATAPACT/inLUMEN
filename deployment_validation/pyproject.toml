[project]
name = "inlumen-deployment-validation"
version = "0.2.0"
description = "Validation and deterministic repair service for InLumen generated deployment artifacts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2,<3",
  "pyyaml>=6,<7"
]

[tool.setuptools]
packages = ["app"]
